<head>

<style>
/* Layout: sticky brand bar, one centered column (max 1080px), cards in an auto-fill grid; reader is a quiet paper panel. */
:root{
  --bg:#F3F7FC; --surface:#FFFFFF; --surface2:#EAF1FA; --line:#D6E0EE;
  --ink:#0E2244; --ink2:#4A5B78; --primary:#1560D4; --primary-ink:#FFFFFF; --primary-hover:#0F4CAD;
  --sun:#FFD25A; --sun-soft:#FFF4D2; --sun-ink:#6E4E00; --coral:#E8546A; --coral-soft:#FDE7EA;
  --mint-soft:#E2F7EE; --mint-ink:#16603F; --blue-soft:#E4EFFD; --blue-ink:#1A4C8F;
  --amber-soft:#FDF1DD; --amber-ink:#7A4600; --red-soft:#FCE9E3; --red-ink:#8C2B10;
  --paper:#FFFFFF; --hero1:#1560D4; --hero2:#18A7E0; --band:#E3F0FA; --kblue:#1F7BBE; --kbtn:#2E8BC9;
  --f-display:'Zen Maru Gothic','Hiragino Maru Gothic ProN','Yu Gothic',sans-serif;
  --f-body:'Zen Kaku Gothic New','Hiragino Sans','Yu Gothic',sans-serif;
  --f-read:'Shippori Mincho','Hiragino Mincho ProN','Yu Mincho',serif;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0A1426; --surface:#122039; --surface2:#1A2C4C; --line:#28406A;
  --ink:#E8EEF9; --ink2:#A8B7D0; --primary:#5AA2FF; --primary-ink:#06152E; --primary-hover:#86BBFF;
  --sun:#FFD25A; --sun-soft:#3A3014; --sun-ink:#FFE08A; --coral:#FF8696; --coral-soft:#3D1D25;
  --mint-soft:#123A2B; --mint-ink:#8BE3BC; --blue-soft:#14315A; --blue-ink:#A9CCFF;
  --amber-soft:#3A2A10; --amber-ink:#FFC977; --red-soft:#40201A; --red-ink:#FFAE95;
  --paper:#0F1B31; --hero1:#123E85; --hero2:#0E6A92; --band:#10243F; --kblue:#7CC0F2; --kbtn:#2E8BC9; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0A1426; --surface:#122039; --surface2:#1A2C4C; --line:#28406A;
  --ink:#E8EEF9; --ink2:#A8B7D0; --primary:#5AA2FF; --primary-ink:#06152E; --primary-hover:#86BBFF;
  --sun:#FFD25A; --sun-soft:#3A3014; --sun-ink:#FFE08A; --coral:#FF8696; --coral-soft:#3D1D25;
  --mint-soft:#123A2B; --mint-ink:#8BE3BC; --blue-soft:#14315A; --blue-ink:#A9CCFF;
  --amber-soft:#3A2A10; --amber-ink:#FFC977; --red-soft:#40201A; --red-ink:#FFAE95;
  --paper:#0F1B31; --hero1:#123E85; --hero2:#0E6A92; --band:#10243F; --kblue:#7CC0F2; --kbtn:#2E8BC9; color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:15px;line-height:1.7}
h1,h2,h3{font-family:var(--f-display);text-wrap:balance;margin:0;line-height:1.4}
h1{font-size:28px}h2{font-size:21px}h3{font-size:17px}
a{color:var(--primary)}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--primary);outline-offset:2px}
.wrap{max-width:1080px;margin:0 auto;padding-inline:16px}
header.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:10;background:var(--surface);border-bottom:1px solid var(--line)}
.topin{display:flex;flex-wrap:wrap;align-items:center;gap:8px 16px;padding-block:10px}
.brand{display:flex;align-items:center;gap:10px;background:none;border:0;cursor:pointer;padding:4px;border-radius:12px}
.brand img{width:40px;height:40px;border-radius:10px}
.brand span{font-family:var(--f-display);font-weight:700;font-size:20px;color:var(--ink)}
nav.main{display:flex;flex-wrap:wrap;gap:4px;margin-left:auto;align-items:center}
.nb{background:none;border:0;border-radius:10px;padding:10px 12px;min-height:44px;cursor:pointer;color:var(--ink2);font-weight:500}
.nb:hover{background:var(--surface2);color:var(--ink)}
.nb.on{background:var(--surface2);color:var(--ink);font-weight:700}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;border-radius:12px;padding:10px 18px;min-height:44px;cursor:pointer;font-weight:700;border:1.5px solid var(--primary);background:var(--primary);color:var(--primary-ink);text-decoration:none}
.btn:hover{background:var(--primary-hover);border-color:var(--primary-hover)}
.btn.ghost{background:var(--surface);color:var(--primary)}
.btn.ghost:hover{background:var(--surface2)}
.btn.danger{background:var(--surface);color:var(--coral);border-color:var(--coral)}
.btn.small{min-height:36px;padding:6px 12px;font-size:14px;border-radius:10px}
.btn[disabled]{opacity:.5;cursor:not-allowed}
.chip{border:1.5px solid var(--line);background:var(--surface);border-radius:999px;padding:6px 14px;min-height:38px;cursor:pointer;color:var(--ink2);font-weight:500}
.chip.on{background:var(--ink);border-color:var(--ink);color:var(--bg)}
.row{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.stack{display:flex;flex-direction:column;gap:16px}
.muted{color:var(--ink2);font-size:14px}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:20px}
main{padding-block:24px 64px}
.hero{background:linear-gradient(120deg,var(--hero1),var(--hero2));color:#fff;border-radius:20px;padding:28px;display:flex;flex-wrap:wrap;gap:24px;align-items:center}
.hero .t{flex:1 1 380px;display:flex;flex-direction:column;gap:10px;min-width:0}
.hero .eyebrow{font-size:13px;font-weight:700;letter-spacing:.08em;color:#FFE7A3}
.hero h1{color:#fff;font-size:27px}
.hero p{margin:0;color:#E4EFFF}
.lead{flex:0 1 300px;background:rgba(255,255,255,.14);border-radius:16px;padding:16px;display:flex;flex-direction:column;gap:6px;min-width:0}
.lead .k{font-size:13px;color:#E4EFFF}
.lead .v{font-family:var(--f-display);font-size:18px;font-weight:700;color:#fff}
.lead .btn{background:#fff;color:#0E2244;border-color:#fff;margin-top:6px}
.brand .tl{display:flex;flex-direction:column;align-items:flex-start;line-height:1.2}
.brand .tl small{font-size:12px;color:var(--ink2);font-weight:500;letter-spacing:.06em}
body{overflow-x:clip}
.hsearch{display:flex;align-items:center;gap:8px;background:var(--surface2);border-radius:6px;padding:0 12px;min-height:42px;flex:1 1 200px;max-width:340px}
.hsearch input{border:0;background:none;outline:none;min-width:0;width:100%;min-height:40px}
.hsearch svg{flex:none;color:var(--ink2)}
.band{background:var(--band);width:100vw;margin-left:calc(50% - 50vw);padding-block:30px 40px}
.band-in{max-width:1200px;margin:0 auto;padding-inline:16px;display:flex;flex-direction:column;align-items:center;gap:24px}
.catch{font-family:var(--f-read);font-weight:600;color:var(--kblue);font-size:clamp(34px,6vw,54px);letter-spacing:.14em;text-align:center;margin:0}
.car{position:relative;width:100%;--cw:370px}
.track{display:flex;gap:18px;overflow-x:auto;scroll-snap-type:x mandatory;padding-inline:44px;padding-block:2px;scrollbar-width:none;overscroll-behavior-x:contain}
.track::-webkit-scrollbar{display:none}
.slide{flex:0 0 var(--cw);aspect-ratio:37/20;scroll-snap-align:start;scroll-margin-inline:44px;position:relative;overflow:hidden;cursor:pointer;display:flex;align-items:center;justify-content:center}
.slide:not([data-target]){cursor:default}
.slide>img.bg{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;max-width:none}
.slide .cap{display:flex;flex-direction:column;align-items:center;text-align:center;gap:6px;padding:18px;position:relative}
.slide .e{font-size:11px;font-weight:700;letter-spacing:.14em}
.slide .h{font-family:var(--f-read);font-weight:600;font-size:24px;line-height:1.4;text-wrap:balance}
.slide .p{font-size:13px}
.s-site{background:#0e2246}
.slide.img .icap{position:absolute;inset:auto 0 0 0;display:flex;flex-direction:column;align-items:flex-start;gap:2px;padding:40px 20px 16px;text-align:left;color:#fff;background:linear-gradient(180deg,rgba(8,16,36,0),rgba(8,16,36,.78));text-shadow:0 1px 3px rgba(0,0,0,.5)}
.slide.img .icap .h{font-size:22px}
.slide.img .icap .p{font-size:13px;opacity:.95}
.s-site>.eye{position:absolute;inset:0;width:100%;height:100%;max-width:none;aspect-ratio:auto;border-radius:0;margin:0}
.s-site>.eye img{width:100%;height:100%;object-fit:cover}
.sitechip{position:absolute;right:12px;bottom:12px;background:rgba(255,255,255,.94);color:#0e2246;font-size:12px;font-weight:700;padding:5px 12px;border-radius:999px;box-shadow:0 4px 14px rgba(0,0,0,.25)}
.tag.ext{background:#e8f1ff;color:#1652b8;border-color:#bcd2f5}
.s-brand{background:linear-gradient(130deg,#1560D4,#19B6E6);color:#fff;gap:18px;justify-content:center}
.s-brand img.logo{width:30%;height:auto;border-radius:18px;box-shadow:0 8px 22px rgba(0,0,0,.22)}
.s-brand .cap{align-items:flex-start;text-align:left;padding:0}
.s-brand .h{font-size:34px;letter-spacing:.08em}
.s-spot{background:#FFF1C9;color:#5B3A00}.s-spot .e{color:#C2384F}
.s-bible{background:#16305E;color:#F5E6B8}.s-bible .e{color:#FFD25A}
.s-post{background:#D9F5E9;color:#0F4A33}.s-post .e{color:#16804F}
.s-ai{background:#FFFFFF;color:#0E2244;box-shadow:inset 0 0 0 2px #9CC3EE}.s-ai .e{color:#1560D4}
.carbtn{position:absolute;top:calc(50% - 28px);width:56px;height:56px;border-radius:50%;background:rgba(255,255,255,.94);color:#222;border:0;cursor:pointer;display:flex;align-items:center;justify-content:center;box-shadow:0 2px 12px rgba(0,0,0,.18);z-index:2}
.carbtn.prev{left:12px}.carbtn.next{right:12px}
.intro{text-align:center;color:var(--ink);margin:0;max-width:48em;line-height:1.9}
.bigbtn{width:min(480px,100%);min-height:52px;border-radius:6px;background:var(--kbtn);color:#fff;border:0;font-weight:700;font-size:17px;cursor:pointer;letter-spacing:.06em}
.bigbtn:hover{filter:brightness(.92)}
.cols2{display:flex;flex-wrap:wrap;gap:40px;margin-top:40px}
.colA{flex:999 1 560px;min-width:0}.colB{flex:1 1 300px;min-width:0}
.sh{border-bottom:1px solid var(--line);padding-bottom:12px}
.sh h2{font-size:22px}
.sh h2 span{display:inline-block;font-family:var(--f-display);letter-spacing:.2em;border:1px solid var(--ink2);padding:1px 4px 1px 8px;background:var(--surface)}
.sh p{margin:8px 0 0;color:var(--ink2);font-size:14px}
.items{display:grid;grid-template-columns:repeat(2,minmax(0,1fr))}
.item{display:flex;flex-direction:column;gap:6px;text-align:left;background:none;border:0;border-bottom:1px solid var(--line);padding:20px 16px;cursor:pointer;color:var(--ink);min-width:0}
.items .item:nth-child(odd){border-right:1px solid var(--line);padding-left:0}
.item:hover .it b,.rk button:hover b,.rk button:hover .ic{text-decoration:underline}
.ic{font-family:var(--f-read);color:var(--kblue);font-size:18px;line-height:1.5;font-weight:600;overflow-wrap:anywhere}
.it{line-height:1.5}.it b{font-size:15px}.ia{color:var(--ink2);font-size:14px}
.im{font-size:13px;color:var(--ink2);line-height:1.6}.im i{font-style:normal;margin:0 .35em;color:var(--ink2);opacity:.6}
.rk{list-style:none;margin:0;padding:0}
.rk button{display:flex;gap:14px;width:100%;text-align:left;background:none;border:0;border-bottom:1px solid var(--line);padding:18px 4px;cursor:pointer;color:var(--ink);font:inherit}
.rn{width:22px;flex:none;font-variant-numeric:tabular-nums;color:var(--ink2);padding-top:2px}
.rn.top{color:var(--coral);font-weight:700}
.rb{display:flex;flex-direction:column;gap:4px;min-width:0}
.rk .ic{font-size:16px;color:var(--ink)}
.nb.post{background:var(--kbtn);color:#fff;font-weight:700;border-radius:6px;padding:10px 16px;margin-left:4px}
.nb.post:hover{filter:brightness(.92);background:var(--kbtn);color:#fff}
@media (max-width:720px){.items{grid-template-columns:1fr}.items .item:nth-child(odd){border-right:0;padding-left:16px}.item{padding-inline:4px!important}
  .car{--cw:80vw}.track{padding-inline:4px;gap:12px}.slide{scroll-margin-inline:4px}.carbtn{display:none}.pc{display:none}.s-brand .h{font-size:28px}.slide .h{font-size:20px}}
.workhead{display:flex;flex-wrap:wrap;gap:24px;align-items:flex-start}
.coverbox{flex:0 0 200px;max-width:100%}
.cover-img{width:100%;border-radius:8px;box-shadow:0 6px 20px rgba(14,34,68,.18);cursor:zoom-in;display:block}
figure.ill{margin:1.8em auto;text-align:center;font-family:var(--f-body)}
figure.ill img{max-width:100%;max-height:80vh;width:auto;height:auto;border-radius:4px;cursor:zoom-in;background:#fff;display:inline-block}
figure.ill figcaption{font-size:13px;color:var(--ink2);margin-top:8px;line-height:1.7;text-align:center}
.reader.v figure.ill{writing-mode:horizontal-tb;margin:0 1.4em;width:min(520px,70vw);align-self:center}
.reader.v figure.ill img{max-height:400px}
.ill-ph{min-height:140px;border:1.5px dashed var(--line);border-radius:8px;display:flex;align-items:center;justify-content:center;color:var(--ink2);font-size:13px;font-family:var(--f-body)}
#zoom{position:fixed;inset:0;z-index:40;background:rgba(5,10,20,.88);display:flex;align-items:center;justify-content:center;padding:48px 12px 12px;cursor:zoom-out}
#zoom img{max-width:100%;max-height:100%;object-fit:contain;background:#fff}
#zoom button{position:absolute;top:calc(10px + env(safe-area-inset-top,0px));right:12px;background:#fff;color:#111;border:0;border-radius:999px;padding:8px 16px;font-weight:700;min-height:40px;cursor:pointer}
@media (max-width:560px){.coverbox{flex-basis:140px}}
.eye{display:block;width:100%;aspect-ratio:16/9;border-radius:10px;overflow:hidden;background:var(--surface2);margin-bottom:8px;position:relative;max-width:100%;isolation:isolate;box-shadow:0 1px 2px rgba(14,34,68,.08),0 6px 18px -10px rgba(14,34,68,.35)}
.eye img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;display:block;max-width:none;transition:transform .45s cubic-bezier(.2,.8,.2,1)}
.eye::after{content:"";position:absolute;inset:0;background:linear-gradient(180deg,rgba(0,0,0,.28) 0,rgba(0,0,0,0) 30%,rgba(0,0,0,0) 62%,rgba(0,0,0,.42) 100%);pointer-events:none;z-index:1}
.eye.gen::after{background:linear-gradient(180deg,rgba(0,0,0,.08),rgba(0,0,0,0) 30%)}
.eye.load{background:linear-gradient(100deg,var(--surface2) 30%,var(--line) 50%,var(--surface2) 70%);background-size:300% 100%;animation:shimmer 1.4s linear infinite}
@keyframes shimmer{from{background-position:100% 0}to{background-position:0 0}}
.item:hover .eye img,.item:hover .eye .deco{transform:scale(1.04)}
.eye .eb-tl{position:absolute;top:8px;left:8px;display:flex;gap:5px;z-index:2}
.eye .eb-kind,.eye .eb-new,.eye .eb-up{font-family:var(--f-body);font-size:11px;font-weight:700;letter-spacing:.06em;line-height:1;padding:5px 8px;border-radius:5px}
.eye .eb-kind{background:rgba(255,255,255,.94);color:#0E2244}
.eye .eb-new{background:#E8546A;color:#fff}
.eye .eb-up{background:#1560D4;color:#fff}
.eye .eb-rank{position:absolute;top:8px;right:8px;z-index:2;display:flex;align-items:center;gap:4px;font-family:var(--f-body);font-size:12px;font-weight:700;line-height:1;padding:5px 9px;border-radius:999px;color:#5B3A00;background:#FFD25A;box-shadow:0 2px 8px rgba(0,0,0,.25)}
.eye .eb-rank.r2{background:#E3E8EF;color:#2C3A52}.eye .eb-rank.r3{background:#E9B98B;color:#4A2810}
.eye .eb-bl{position:absolute;left:10px;bottom:8px;z-index:2;font-family:var(--f-body);font-size:12px;font-weight:700;color:#fff;text-shadow:0 1px 4px rgba(0,0,0,.6)}
.eye.gen{display:flex;flex-direction:column;justify-content:center;align-items:center;text-align:center;padding:30px 22px 26px;color:var(--gtc);background:var(--gbg)}
.eye.gen .deco{position:absolute;inset:0;z-index:0;background:var(--gdeco);transition:transform .45s cubic-bezier(.2,.8,.2,1)}
.eye.gen .gt{position:relative;z-index:2;font-family:var(--f-read);font-weight:600;font-size:clamp(17px,2.1vw,23px);line-height:1.45;letter-spacing:.06em;text-wrap:balance;display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden;text-shadow:var(--gts,none)}
.eye.gen .ga{position:relative;z-index:2;margin-top:8px;font-family:var(--f-body);font-size:12px;letter-spacing:.1em;opacity:.85}
.eye.gen .ga::before{content:"";display:block;width:24px;height:1px;background:currentColor;opacity:.6;margin:0 auto 8px}
.eye.gen .eb-bl{color:var(--gtc);text-shadow:none;opacity:.8}
.eye.gen.vt .gt{writing-mode:vertical-rl;display:block;-webkit-line-clamp:none;text-wrap:wrap;max-height:100%;font-size:clamp(16px,1.8vw,20px);overflow:visible}
.eye.gen.vt{flex-direction:row-reverse;gap:14px}
.eye.gen.vt .ga{writing-mode:vertical-rl;margin:0}.eye.gen.vt .ga::before{display:none}
.t-bible{--gbg:#14284E;--gtc:#F3E3B5;--gts:0 1px 0 rgba(0,0,0,.4);--gdeco:radial-gradient(circle at 50% 0%,rgba(255,214,120,.35),transparent 55%),radial-gradient(1.2px 1.2px at 18% 28%,#FFE7A3 50%,transparent 51%),radial-gradient(1px 1px at 78% 22%,#FFE7A3 50%,transparent 51%),radial-gradient(1.4px 1.4px at 66% 72%,#FFE7A3 50%,transparent 51%),radial-gradient(1px 1px at 30% 80%,#FFE7A3 50%,transparent 51%)}

<script type="module">
import { DB, Auth, configured, authErrorText } from './js/backend.js';
(() => {
const LOGO = "assets/logo.webp";
const AI = {
  none:   {label:'AI不使用',       opt:'AIを使っていない', d:'企画から完成まで、AIを一切使っていません。'},
  assist: {label:'AI補助的に利用', opt:'補助的に使った',   d:'アイデア出し・調べもの・誤字チェックなど。本文や絵はすべて自分で作成。'},
  partial:{label:'AI一部に利用',   opt:'一部に使った',     d:'AIが生成した文章・画像を、作品の一部にそのまま、または手直しして使用。'},
  main:   {label:'AI主に利用',     opt:'主に使った',       d:'作品の大部分をAIの生成物で構成。'}
};
const STEPS = [
  ['idea','アイデア・構成','あらすじ・章立ての相談','ネーム・コマ割りの相談'],
  ['research','調べもの','聖書の時代背景や地名','衣装や建物の資料探し'],
  ['text','本文・セリフ','文章の下書き・言い換え','セリフの案'],
  ['proof','校正・推敲','誤字脱字、表現の確認','セリフの誤字確認'],
  ['art','絵','表紙・挿絵','下描き・作画・彩色・背景'],
  ['translate','翻訳','外国語版の作成','外国語版の作成']
];
const STEP_LABEL = Object.fromEntries(STEPS.map(s=>[s[0],s[1]]));
const BOOKS = ['創世記','出エジプト記','レビ記','民数記','申命記','ヨシュア記','士師記','ルツ記','サムエル記上','サムエル記下','列王紀上','列王紀下','歴代志上','歴代志下','エズラ記','ネヘミヤ記','エステル記','ヨブ記','詩篇','箴言','伝道の書','雅歌','イザヤ書','エレミヤ書','哀歌','エゼキエル書','ダニエル書','ホセア書','ヨエル書','アモス書','オバデヤ書','ヨナ書','ミカ書','ナホム書','ハバクク書','ゼパニヤ書','ハガイ書','ゼカリヤ書','マラキ書','マタイによる福音書','マルコによる福音書','ルカによる福音書','ヨハネによる福音書','使徒行伝','ローマ人への手紙','コリント人への第一の手紙','コリント人への第二の手紙','ガラテヤ人への手紙','エペソ人への手紙','ピリピ人への手紙','コロサイ人への手紙','テサロニケ人への第一の手紙','テサロニケ人への第二の手紙','テモテへの第一の手紙','テモテへの第二の手紙','テトスへの手紙','ピレモンへの手紙','ヘブル人への手紙','ヤコブの手紙','ペテロの第一の手紙','ペテロの第二の手紙','ヨハネの第一の手紙','ヨハネの第二の手紙','ヨハネの第三の手紙','ユダの手紙','ヨハネの黙示録'];
const GENRES = ['聖書の物語','青春','現代ドラマ','日常','ファンタジー','ミステリー','歴史','エッセイ・証し','詩','その他'];

const S = {
  db:null, user:null, uid:null, admin:false, ready:false, err:'',
  me:null, members:{}, works:[], banners:[], car:0, pendingIll:{}, authState:'loading', joinReqs:[], email:'', viewDocs:[], mod:{works:{},comments:{}}, spots:[], spotlights:{}, reports:[],
  route:{name:'home'}, f:{kind:'all', ai:'all', book:'', q:'', sort:'new'}, reader:{vertical:false,size:2},
  live:{eps:[], comments:[], spots:[]}, unsubs:[], pageCache:{}
};

// ---------- helpers ----------
const $ = s => document.querySelector(s);
const esc = v => String(v ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const jst = () => new Date(Date.now() + 9*3600e3);
const monthKey = (d=jst()) => d.toISOString().slice(0,7);
const dayKey = () => jst().toISOString().slice(8,10);
const prevMonth = () => { const d = jst(); d.setUTCDate(1); d.setUTCMonth(d.getUTCMonth()-1); return monthKey(d); };
const monthJa = m => `${Number(m.slice(0,4))}年${Number(m.slice(5,7))}月`;
const fmtDate = t => { if(!t) return ''; const d = new Date(t + 9*3600e3); return `${d.getUTCFullYear()}/${d.getUTCMonth()+1}/${d.getUTCDate()}`; };
const pen = uid => (S.members[uid] && S.members[uid].penName) || '名前未設定';
let toastT;
function toast(msg){ const t=$('#toast'); t.textContent=msg; t.hidden=false; clearTimeout(toastT); toastT=setTimeout(()=>t.hidden=true,2800); }
const PII = /(?<![0-9０-９])([0０][0-9０-９]{1,4}[-ー－‐][0-9０-９]{1,4}[-ー－‐][0-9０-９]{3,4}|[0０][789７８９][0０][0-9０-９]{8})(?![0-9０-９])|([A-Za-z0-9._%+-]+@[A-Za-z0-9-]+\.(?!invalid\b)[A-Za-z.]{2,})/;
const canPost = () => !!(S.uid && S.me && S.me.penName && (S.me.age === 'adult' || S.me.guardian));

// ---------- data ----------
function viewsFor(month){
  const counts = {};
  for (const d of S.viewDocs){
    const m = (d.months||{})[month]; if(!m) continue;
    for (const [wid, days] of Object.entries(m)) counts[wid] = (counts[wid]||0) + (Array.isArray(days)?days.length:0);
  }
  return counts;
}
function visibleWorks(){ return S.works.filter(w => !S.mod.works[w.id] || S.admin || w.authorId===S.uid); }
function ranking(month, onlySpot){
  const c = viewsFor(month);
  return visibleWorks().filter(w => !S.mod.works[w.id] && (!onlySpot || w.spotlight))
    .map(w => ({w, n:c[w.id]||0})).filter(x=>x.n>0).sort((a,b)=>b.n-a.n);
}
async function recordView(w){
  if(!S.uid || S.readOnly || w.authorId === S.uid) return;
  const m = monthKey(), day = dayKey();
  const ref = S.db.doc('views/'+S.uid);
  try{
    const snap = await ref.get();
    const body = snap.exists ? JSON.parse(JSON.stringify(snap.data())) : {months:{}};
    body.months = body.months || {};
    const mo = body.months[m] = body.months[m] || {};
    const days = mo[w.id] = mo[w.id] || [];
    if (days.includes(day)) return;
    days.push(day);
    const keep = Object.keys(body.months).sort().slice(-3);
    body.months = Object.fromEntries(keep.map(k=>[k, body.months[k]]));
    await ref.set(body);
  }catch(e){ /* a missed view is not worth interrupting the reader */ }
}

function sub(q, fn){ try{ return q.onSnapshot(fn, ()=>{}); }catch(e){ return ()=>{}; } }
function startGlobal(){
  sub(S.db.collection('works').orderBy('updatedAt','desc'), s => { S.works = s.docs.map(d=>({id:d.id, ...d.data()})); rerender(); });
  sub(S.db.collection('members'), s => { S.members = Object.fromEntries(s.docs.map(d=>[d.id, d.data()])); if(S.uid && S.members[S.uid]) S.me = S.members[S.uid]; S.ready = true; rerender(); });
  sub(S.db.collection('views'), s => { S.viewDocs = s.docs.map(d=>d.data()); rerender(); });
  sub(S.db.doc('moderation/state'), s => { const d = s.exists ? s.data() : {}; S.mod = {works:d.works||{}, comments:d.comments||{}, reports:d.reports||{}}; rerender(); });
  sub(S.db.collection('banners'), s => { S.banners = s.docs.map(d=>({id:d.id, ...d.data()})).sort((a,b)=>a.order-b.order); rerender(); });
  sub(S.db.collection('spotlight'), s => { S.spotlights = Object.fromEntries(s.docs.map(d=>[d.id, d.data()])); rerender(); });
  if (S.admin) sub(S.db.collection('reports'), s => { S.reports = s.docs.map(d=>({uid:d.id, ...d.data()})); rerender(); });

}
function stopLive(){ S.unsubs.forEach(u=>{try{u()}catch(e){}}); S.unsubs=[]; S.live={eps:[],comments:[],spots:[]}; }
function startWorkLive(wid){
  stopLive();
  S.unsubs.push(sub(S.db.collection('episodes').where('workId','==',wid), s => { S.live.eps = s.docs.map(d=>({id:d.id,...d.data()})).sort((a,b)=>a.no-b.no); rerender(); }));
  S.unsubs.push(sub(S.db.collection('comments').where('workId','==',wid), s => { S.live.comments = s.docs.map(d=>({id:d.id,...d.data()})).sort((a,b)=>a.createdAt-b.createdAt); rerender(); }));
}

// ---------- routing ----------
const FORM_ROUTES = ['newwork','editwork','newep','editep','profile'];
function askProfile(then){ if (S.readOnly) return go('readonly'); S.askProfile = {then: then || null}; syncWelcome(); }
function go(name, params={}){
  if (S.readOnly && ['newwork','newep','editwork','editep','profile'].includes(name)) name = 'readonly';
  if ((name==='newwork' || name==='newep') && S.uid && !S.me){ return askProfile({name, params}); }
  const prevWid = S.route.wid;

function slides(lead, m){
  const out = [
    {kind:'brand', h:'物語を形に', p:'小説と漫画の投稿サイト', target: S.uid ? 'post' : ''},
    {kind:'spot', e:`MONTHLY SPOTLIGHT · ${monthJa(m)}`, h: lead ? `いま1位は「${lead.w.title}」` : '今月いちばん読まれた作品が動画に', p: lead ? `${pen(lead.w.authorId)} · ${lead.n} 閲覧` : '月末の1位をYouTubeで紹介します', target:'spot'},
  ];

  for (const w of visibleWorks().filter(w=>extUrl(w)).slice(0,3)) out.push({kind:'site', w, h:w.title, target:'site:'+w.id});
  out.push({kind:'bible', e:'BIBLE STORIES', h:'聖書から生まれた物語', p:'題材の書名から作品をさがせます', target:'bible'});

function slideHtml(s, i, n){
  const tgt = s.target ? ` data-target="${esc(s.target)}" tabindex="0"` : '';
  const lab = ` role="group" aria-roledescription="slide" aria-label="${i+1} / ${n}：${esc(s.h)}"`;
  if (s.kind==='img' && s.img) return `<div class="slide img"${tgt}${lab}><img class="bg" src="${esc(s.img)}" alt="${esc(s.h)}">${s.h?`<div class="icap">${s.e?`<span class="e">${esc(s.e)}</span>`:''}<span class="h">${esc(s.h)}</span>${s.p?`<span class="p">${esc(s.p)}</span>`:''}</div>`:''}</div>`;
  if (s.kind==='site') return `<div class="slide s-site"${tgt}${lab}>${eyeHtml(s.w)}<span class="sitechip">↗ 作品サイトを見る</span></div>`;
  if (s.kind==='brand') return `<div class="slide s-brand"${tgt}${lab}><img class="logo" src="${LOGO}" alt=""><div class="cap"><span class="h">${esc(s.h)}</span><span class="p">${esc(s.p)}</span></div></div>`;
  return `<div class="slide s-${esc(s.kind)}"${tgt}${lab}><div class="cap">${s.e?`<span class="e">${esc(s.e)}</span>`:''}<span class="h">${esc(s.h)}</span>${s.p?`<span class="p">${esc(s.p)}</span>`:''}</div></div>`;
}
function carousel(lead, m){
  const sl = slides(lead, m); if (S.car >= sl.length) S.car = 0;
  return `<div class="car" aria-roledescription="carousel" aria-label="おしらせ">
    <div class="track" id="car-track">${sl.map((s,i)=>slideHtml(s,i,sl.length)).join('')}</div>
    <button class="carbtn prev" data-car="-1" aria-label="前のバナー"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" aria-hidden="true"><path d="M15 5l-7 7 7 7"/></svg></button>
    <button class="carbtn next" data-car="1" aria-label="次のバナー"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" aria-hidden="true"><path d="M9 5l7 7-7 7"/></svg></button>
  </div>`;
}
function carTo(i, smooth){
  const tr = $('#car-track'); if(!tr) return; const n = tr.children.length; if(!n) return;
  const maxLeft = tr.scrollWidth - tr.clientWidth;
  S.car = (i + n) % n;
  let left = tr.children[S.car].offsetLeft - tr.children[0].offsetLeft;
  if (left > maxLeft + 4 && i > 0 && smooth) { S.car = 0; left = 0; }
  tr.scrollTo({left: Math.min(left, maxLeft), behavior: smooth ? 'smooth' : 'auto'});
}
let carPause = false;
const reduceMotion = window.matchMedia && matchMedia('(prefers-reduced-motion: reduce)').matches;
setInterval(()=>{ if (S.route.name==='home' && !carPause && !reduceMotion && document.visibilityState==='visible') carTo(S.car+1, true); }, 5000);
function bindCarousel(){
  const tr = $('#car-track'); if(!tr) return;
  carTo(S.car, false);
  const car = tr.closest('.car');
  car.addEventListener('pointerenter', ()=>carPause=true); car.addEventListener('pointerleave', ()=>carPause=false);
  car.addEventListener('focusin', ()=>carPause=true); car.addEventListener('focusout', ()=>carPause=false);
  tr.addEventListener('touchstart', ()=>carPause=true, {passive:true}); tr.addEventListener('touchend', ()=>setTimeout(()=>carPause=false, 4000), {passive:true});
  let t; tr.addEventListener('scroll', ()=>{ clearTimeout(t); t = setTimeout(()=>{
    const x = tr.scrollLeft + tr.children[0].offsetLeft; let best=0, bd=1e9;
    [...tr.children].forEach((s,k)=>{ const d=Math.abs(s.offsetLeft - x); if(d<bd){bd=d;best=k;} });
    S.car = best;
  }, 100); }, {passive:true});
}

function viewSearch(){

  if (f.sort==='views') list = list.slice().sort((a,b)=>(counts[b.id]||0)-(counts[a.id]||0));

  return `<main class="stack">

function aiPanel(w){

  if (ai.level==='none') return `<div class="panel row" style="justify-content:space-between"><div class="row"><span class="lab">AI利用の申告</span>${aiBadge('none')}</div><span class="muted">この作品はAIを使わずに制作されています（作者の申告）。</span></div>`;
  return `<details class="panel"><summary class="row" style="cursor:pointer;justify-content:space-between;list-style:none"><span class="row"><span class="lab">AI利用の申告</span>${aiBadge(ai.level)}</span><span class="btn ghost small">どのように使ったか見る</span></summary>
    <div class="stack" style="gap:10px;margin-top:14px;border-top:1px solid var(--line);padding-top:14px">
      <div class="row"><span class="muted">使った工程：</span>${(ai.steps||[]).map(s=>`<span class="tag">${esc(STEP_LABEL[s]||s)}</span>`).join('') || '<span class="muted">記載なし</span>'}</div>
      ${ai.note ? `<p style="margin:0;white-space:pre-wrap">${esc(ai.note)}</p>` : ''}
      ${ai.tool ? `<span class="muted">使ったツール：${esc(ai.tool)}</span>` : ''}
      <span class="muted">作者による申告です。申告と実態が明らかに違う場合は、運営が設定を見直します。</span>
    </div></details>`;
}
function viewWork(){
  const w = S.works.find(x=>x.id===S.route.wid);
  if (!w) return `<main><div class="empty"><p>この作品は見つかりませんでした。削除された可能性があります。</p><button class="btn" data-go="home">作品一覧へ</button></div></main>`;
  const hidden = S.mod.works[w.id];
  if (hidden && !S.admin && w.authorId!==S.uid) return `<main><div class="empty"><p>この作品は運営により非表示になっています。</p><button class="btn" data-go="home">作品一覧へ</button></div></main>`;
  const mine = w.authorId===S.uid, eps = S.live.eps;
  const cur = eps.find(e=>e.id===S.route.eid) || eps[0];
  const n = viewsFor(monthKey())[w.id] || 0;
  return `<main class="stack">
    <div><button class="linkbtn" data-go="home">← 作品一覧へもどる</button></div>
    ${hidden ? '<div class="notice">この作品は運営により非表示になっています（作者と運営にだけ表示されています）。</div>' : ''}
    <section class="workhead">
      ${w.coverId ? `<div class="coverbox">${imgOrPh(w.coverId, w.title+' 表紙', 'cover-img')}</div>` : ''}
      <div class="stack" style="gap:8px;flex:1 1 320px;min-width:0">
      <div class="row">${kindTag(w)}${bibleTag(w)}<span class="muted">${esc(w.genre||'')}</span>${(w.tags||[]).map(t=>`<span class="tag">#${esc(t)}</span>`).join('')}</div>
      ${w.catchcopy ? `<span class="ic" style="font-size:20px">${esc(w.catchcopy)}</span>` : ''}
      <h1>${esc(w.title)}</h1>
      <span class="muted">${esc(pen(w.authorId))} · 全${eps.length}話 · 今月 ${n} 閲覧${w.spotlight?' · 月間スポットライト対象':''}</span>
      ${w.summary ? `<p style="margin:0;white-space:pre-wrap">${esc(w.summary)}</p>` : ''}
      <div class="row">
        ${extUrl(w) ? `<a class="btn small" href="${esc(extUrl(w))}" target="_blank" rel="noopener noreferrer">↗ 作品サイトを開く</a>` : ''}
        ${(mine||S.admin) ? `<button class="btn ghost small" data-go="editwork" data-wid="${esc(w.id)}">作品情報を編集</button>` : ''}
        ${mine ? `<button class="btn ghost small" data-go="newep" data-wid="${esc(w.id)}">話を追加</button>` : ''}
        ${!mine && S.uid ? `<button class="linkbtn" data-report="work" data-id="${esc(w.id)}">この作品を通報する</button>` : ''}
      </div>
      </div>
    </section>
    ${aiPanel(w)}
    ${eps.length ? readerBlock(w, cur, eps) : `<div class="empty"><p>まだ本文が投稿されていません。</p>${mine?`<button class="btn" data-go="newep" data-wid="${esc(w.id)}">第1話を投稿する</button>`:''}</div>`}
    ${eps.length > 1 ? `<section class="panel"><h2 style="font-size:18px;margin-bottom:6px">もくじ</h2><div class="eps">${eps.map(e=>`<button class="ep ${cur&&e.id===cur.id?'cur':''}" data-ep="${esc(e.id)}"><span>第${e.no}話　${esc(e.title||'')}</span><span class="muted">${fmtDate(e.createdAt)}</span></button>`).join('')}</div></section>` : ''}
    ${commentsBlock(w)}
  </main>`;
}
const ILL = /^\[\[img:([A-Za-z0-9_-]+)(?:\|(.*))?\]\]$/;
function imgOrPh(id, alt, cls){
  const src = S.pageCache[id];
  if (src) return `<img class="${cls||''}" src="${esc(src)}" alt="${esc(alt)}" data-zoom="${esc(id)}">`;
  if (src === '') return `<div class="ill-ph">画像を読み込めませんでした</div>`;
  return `<div class="ill-ph" data-page="${esc(id)}">画像を読み込んでいます…</div>`;
}
function figHtml(id, cap){
  return `<figure class="ill">${imgOrPh(id, cap || '挿絵')}${cap?`<figcaption>${esc(cap)}</figcaption>`:''}</figure>`;
}
function readerBlock(w, e, eps){
  const idx = eps.indexOf(e), prev = eps[idx-1], next = eps[idx+1];
  const mine = w.authorId===S.uid;
  const nav = `<div class="row" style="justify-content:space-between">
      <button class="btn ghost" ${prev?`data-ep="${esc(prev.id)}"`:'disabled'}>← 前の話</button>
      ${next?`<button class="btn" data-ep="${esc(next.id)}">次の話へ →</button>`:'<span class="muted">最新話です</span>'}</div>`;
  const head = `<div class="row" style="justify-content:space-between"><h2>第${e.no}話　${esc(e.title||'')}</h2>
      <div class="row">${mine?`<button class="linkbtn" data-go="editep" data-wid="${esc(w.id)}" data-eid="${esc(e.id)}">この話を編集</button>`:''}
      ${w.kind==='novel' ? `<button class="chip ${!S.reader.vertical?'on':''}" data-rd="h">横書き</button><button class="chip ${S.reader.vertical?'on':''}" data-rd="v">縦書き</button>
        <button class="chip ${S.reader.size===1?'on':''}" data-sz="1" aria-label="文字サイズ 小">小</button><button class="chip ${S.reader.size===2?'on':''}" data-sz="2" aria-label="文字サイズ 中">中</button><button class="chip ${S.reader.size===3?'on':''}" data-sz="3" aria-label="文字サイズ 大">大</button>` : `<span class="muted">${w.format==='v'?'縦読み':'横読み'}</span>`}</div></div>`;
  if (w.kind==='manga'){
    const pages = (e.pages||[]).map((pid,i)=>{ const src = S.pageCache[pid]; return src ? `<img src="${esc(src)}" alt="第${e.no}話 ${i+1}ページ">` : src==='' ? `<div class="empty" style="width:100%;max-width:760px">${i+1}ページ目を読み込めませんでした。</div>` : `<div class="empty" style="width:100%;max-width:760px;min-height:200px" data-page="${esc(pid)}">${i+1}ページ目を読み込んでいます…</div>`; }).join('');
    return `<section class="stack">${head}<div class="manga ${w.format==='v'?'v':''}">${pages || '<p class="muted">画像がありません。</p>'}</div>${nav}</section>`;
  }
  const lines = String(e.body||'').split('\n');
  const paras = lines.map((t,i)=>{
    if(!t.trim()) return `<div class="para gap"></div>`;
    const im = t.trim().match(ILL); if (im) return figHtml(im[1], im[2]||'');
    return `<p class="para">${esc(t)}</p>`;
  }).join('');
  return `<section class="stack">${head}
    <div class="reader ${S.reader.vertical?'v':'h'} s${S.reader.size}"><div class="body">${paras}</div></div>
    ${nav}</section>`;
}
function commentsBlock(w){
  const list = S.live.comments.filter(c => !S.mod.comments[c.id] || S.admin);
  const allowed = canPost();
  return `<section class="panel stack" style="gap:10px">
    <div class="row" style="justify-content:space-between"><h2 style="font-size:18px">応援コメント</h2><span class="muted">${list.length}件</span></div>
    <div>${list.length ? list.map(c=>`<div class="cm"><span class="who">${esc(pen(c.uid))} <span class="muted" style="font-weight:400">${fmtDate(c.createdAt)}</span>${S.mod.comments[c.id]?' <span class="tag">非表示中</span>':''}</span><span class="tx">${esc(c.text)}</span>
      <div class="row">${c.uid===S.uid?`<button class="linkbtn" data-delc="${esc(c.id)}">削除</button>`:''}${c.uid!==S.uid&&S.uid?`<button class="linkbtn" data-report="comment" data-id="${esc(c.id)}">通報</button>`:''}${S.admin?`<button class="linkbtn" data-hidec="${esc(c.id)}">${S.mod.comments[c.id]?'再表示':'非表示にする'}</button>`:''}</div></div>`).join('') : '<p class="muted" style="margin:0">まだコメントはありません。最初の応援コメントを書いてみませんか。</p>'}</div>
    ${allowed ? `<div class="field"><label for="cm-text">コメントを書く</label><textarea id="cm-text" class="in" rows="3" maxlength="800" placeholder="感想や応援のことばをどうぞ。名前・学校名・電話番号などの個人情報は書かないでください。"></textarea></div>
      <div class="row" style="justify-content:space-between"><span class="err" id="cm-err"></span><button class="btn" data-act="comment" data-wid="${esc(w.id)}">送信する</button></div>`
      : S.readOnly ? `<p class="muted" style="margin:0">コメントは、いまの試作版では保存できません。<button class="linkbtn" data-go="readonly">くわしく</button></p>`
      : S.uid && !S.me ? `<div class="row" style="justify-content:space-between"><span class="muted">コメントするときに、ペンネームを決めます。</span><button class="btn" data-act="ask-profile">コメントを書く</button></div>`
      : S.uid ? `<p class="muted" style="margin:0">コメントするには、保護者の方の同意の確認が必要です。<button class="linkbtn" data-go="profile">プロフィールへ</button></p>` : ''}
  </section>`;
}

// ---------- drag & drop for image inputs ----------
const IMG_TYPES = ['image/png','image/jpeg','image/webp'];
function dropStyle(){
  if (document.getElementById('drop-css')) return;
  const st = document.createElement('style'); st.id = 'drop-css';
  st.textContent = '.drop{display:flex;flex-direction:column;align-items:center;gap:6px;padding:22px 16px;border:2px dashed var(--line);border-radius:14px;background:var(--surface2);text-align:center;transition:background .15s,border-color .15s}'
    + '.drop.small{padding:14px 12px}.drop .drop-t{font-weight:700;color:var(--ink)}.drop .in{max-width:100%}'
    + '.drop.over{border-color:var(--kblue);background:rgba(21,96,212,.08)}.drop.over .drop-t{color:var(--kblue)}';
  document.head.appendChild(st);
}
function bindDrops(){
  dropStyle();
  document.querySelectorAll('.drop[data-drop]').forEach(zone => {
    if (zone.dataset.bound) return; zone.dataset.bound = '1';
    const input = document.getElementById(zone.dataset.drop); if (!input) return;
    const on = e => { if (![...(e.dataTransfer && e.dataTransfer.types || [])].includes('Files')) return; e.preventDefault(); zone.classList.add('over'); };
    zone.addEventListener('dragenter', on); zone.addEventListener('dragover', on);
    zone.addEventListener('dragleave', e => { if (!zone.contains(e.relatedTarget)) zone.classList.remove('over'); });
    zone.addEventListener('drop', e => {
      e.preventDefault(); zone.classList.remove('over');
      const dropped = [...(e.dataTransfer.files || [])].filter(f => IMG_TYPES.includes(f.type));
      if (!dropped.length){ toast('JPG・PNG・WebPの画像をドロップしてください'); return; }
      const dt = new DataTransfer();
      if (zone.dataset.append) [...input.files].forEach(f => dt.items.add(f));
      dropped.forEach(f => dt.items.add(f));
      input.files = dt.files;
      input.dispatchEvent(new Event('change', {bubbles:true}));
      if (zone.dataset.append) toast(`${input.files.length}枚の画像を選んでいます`);
    });
  });
}
// 枠の外に落としたときに、ブラウザが画像を開いてしまわないようにする
document.addEventListener('dragover', e => { if ([...(e.dataTransfer && e.dataTransfer.types || [])].includes('Files') && !e.target.closest('.drop')) e.preventDefault(); });
document.addEventListener('drop', e => { if ([...(e.dataTransfer && e.dataTransfer.types || [])].includes('Files') && !e.target.closest('.drop')) e.preventDefault(); });

// ---------- image compression ----------
const CROP = {img:null, zoom:1, cx:.5, cy:.5, removed:false};
function cropGeom(W, H){
  const im = CROP.img, base = Math.max(W/im.naturalWidth, H/im.naturalHeight), sc = base*CROP.zoom;
  const dw = im.naturalWidth*sc, dh = im.naturalHeight*sc;
  let left = W/2 - CROP.cx*dw, top = H/2 - CROP.cy*dh;
  left = Math.min(0, Math.max(W-dw, left)); top = Math.min(0, Math.max(H-dh, top));
  CROP.cx = (W/2 - left)/dw; CROP.cy = (H/2 - top)/dh;
  return {left, top, dw, dh};
}
function cropDraw(){
  const box = $('#w-crop'); if (!box || !CROP.img) return;
  const W = box.clientWidth, H = box.clientHeight, g = cropGeom(W, H);
  const im = box.querySelector('img.src');
  Object.assign(im.style, {left:g.left+'px', top:g.top+'px', width:g.dw+'px', height:g.dh+'px'});
}
function cropExport(){
  const W = 1280, H = 720, c = document.createElement('canvas'); c.width = W; c.height = H;
  const g = cropGeom(W, H), ctx = c.getContext('2d');
  ctx.fillStyle = '#fff'; ctx.fillRect(0,0,W,H); ctx.imageSmoothingQuality = 'high';
  ctx.drawImage(CROP.img, g.left, g.top, g.dw, g.dh);
  let q = .86, out = c.toDataURL('image/jpeg', q);
  while (out.length > 230000 && q > .5){ q -= .08; out = c.toDataURL('image/jpeg', q); }
  return out;
}
function bindCropper(){
  const box = $('#w-crop'); if (!box) return;
  Object.assign(CROP, {img:null, zoom:1, cx:.5, cy:.5, removed:false});
  const input = $('#w-eye'), zoom = $('#w-zoom'), ctl = $('#w-crop-ctl'), ov = box.querySelector('.ov');
  input.addEventListener('change', async () => {
    const f = input.files[0]; if (!f) return;
    const url = URL.createObjectURL(f);
    const im = new Image(); im.className = 'src'; im.alt = '';
    try{ await new Promise((res,rej)=>{ im.onload=res; im.onerror=rej; im.src=url; }); }catch(x){ toast('画像を読み込めませんでした'); return; }
    CROP.img = im; CROP.zoom = 1; CROP.cx = .5; CROP.cy = .5; CROP.removed = false;
    box.querySelectorAll('.eye,img.src').forEach(el=>el.remove()); box.prepend(im);
    box.classList.remove('empty'); ov.hidden = false; ctl.hidden = false; zoom.value = 1; cropDraw();
  });
  zoom.addEventListener('input', () => { CROP.zoom = Number(zoom.value); cropDraw(); });
  let drag = null;
  box.addEventListener('pointerdown', e => { if (!CROP.img) return; drag = {x:e.clientX, y:e.clientY}; box.setPointerCapture(e.pointerId); box.style.cursor='grabbing'; });
  box.addEventListener('pointermove', e => { if (!drag) return; const g = cropGeom(box.clientWidth, box.clientHeight);
    CROP.cx -= (e.clientX-drag.x)/g.dw; CROP.cy -= (e.clientY-drag.y)/g.dh; drag = {x:e.clientX, y:e.clientY}; cropDraw(); });
  const end = () => { drag = null; box.style.cursor=''; };
  box.addEventListener('pointerup', end); box.addEventListener('pointercancel', end);
  box.addEventListener('wheel', e => { if (!CROP.img) return; e.preventDefault(); CROP.zoom = Math.min(3, Math.max(1, CROP.zoom - e.deltaY*0.0015)); zoom.value = CROP.zoom; cropDraw(); }, {passive:false});
  const rm = $('#w-eye-rm'); if (rm) rm.addEventListener('click', () => { CROP.removed = true; CROP.img = null; input.value=''; ctl.hidden = true; ov.hidden = true; box.classList.add('empty');
    const w = S.works.find(x=>x.id===S.route.wid) || {}; box.querySelectorAll('.eye,img.src').forEach(el=>el.remove());
    box.insertAdjacentHTML('afterbegin', eyeHtml({...w, eyecatchId:'', coverId:'', eyeTheme:$('#w-theme').value})); rm.remove(); });
  $('#w-theme').addEventListener('change', () => { if (CROP.img) return; const w = S.works.find(x=>x.id===S.route.wid) || {kind:'novel', id:'new', authorId:S.uid};
    const cur = box.querySelector('.eye.gen'); if (!cur) return;
    cur.outerHTML = eyeHtml({...w, title: ($('#w-title')||{}).value || w.title || 'タイトル', genre: ($('#w-genre')||{}).value, eyecatchId:'', coverId:'', eyeTheme: $('#w-theme').value}); });
}
window.addEventListener('resize', () => { if (CROP.img) cropDraw(); });
async function compress(file, maxW=1000){
  const url = URL.createObjectURL(file);
  const img = await new Promise((res,rej)=>{ const i=new Image(); i.onload=()=>res(i); i.onerror=rej; i.src=url; });
  let width = Math.min(maxW, img.naturalWidth), q = 0.82, out = '';
  for (let tries=0; tries<6; tries++){
    const c = document.createElement('canvas'); c.width = width; c.height = Math.round(img.naturalHeight * width / img.naturalWidth);
    const ctx = c.getContext('2d'); ctx.fillStyle='#fff'; ctx.fillRect(0,0,c.width,c.height); ctx.drawImage(img,0,0,c.width,c.height);
    out = c.toDataURL('image/jpeg', q);
    if (out.length < 230000) break;
    if (q > 0.6) q -= 0.1; else width = Math.round(width*0.82);
  }
  URL.revokeObjectURL(url);
  if (out.length >= 240000) throw new Error('too_big');
  return out;
}

      const pid = newId(); await S.db.doc('pages/'+pid).set({uid:S.uid, workId: old?old.id:'', data}); S.pageCache[pid]=data; body.coverId = pid; }
    if (CROP.img){ const data = cropExport(); const pid = newId(); await S.db.doc('pages/'+pid).set({uid:S.uid, workId: old?old.id:'', data}); S.pageCache[pid]=data; body.eyecatchId = pid; }

    else { const id = newId(); await S.db.doc('works/'+id).set({...body, authorId:S.uid, createdAt:Date.now(), epCount:0}); toast('作品を登録しました'); go('newep',{wid:id}); }
  }catch(x){ err.textContent = dbErr(x); }
}
async function saveEp(e){
  e.preventDefault();
  const err = $('#e-err'); err.textContent='';
  const w = S.works.find(x=>x.id===S.route.wid); if(!w) return;
  const old = S.route.name==='editep' ? S.live.eps.find(x=>x.id===S.route.eid) : null;
  const no = Number($('#ep-form').dataset.no);
  const title = $('#e-title').value.trim();
  const btn = $('#e-submit'); btn.disabled = true;
  try{
    const body = {workId:w.id, no, title, authorId:S.uid, createdAt: old?old.createdAt:Date.now(), updatedAt:Date.now()};
    if (w.kind==='novel'){
      const text = $('#e-body').value.replace(/\r/g,'');
      if (!text.trim()) { err.textContent='本文を入力してください。'; btn.disabled=false; return; }
      const used = [...text.matchAll(/\[\[img:([A-Za-z0-9_-]+)/g)].map(m=>m[1]);
      for (const pid of used){ if (S.pendingIll[pid]){ btn.textContent='挿絵を保存中…'; await S.db.doc('pages/'+pid).set({uid:S.uid, workId:w.id, data:S.pendingIll[pid]}); S.pageCache[pid]=S.pendingIll[pid]; delete S.pendingIll[pid]; } }
      if (new Blob([text]).size > 200000) { err.textContent='1話が長すぎます。2つの話に分けてください。'; btn.disabled=false; return; }
      body.body = text;
    } else {
      const files = [...$('#e-files').files].sort((a,b)=>a.name.localeCompare(b.name,undefined,{numeric:true})).slice(0,40);
      if (!files.length && !old) { err.textContent='漫画の画像を選んでください。'; btn.disabled=false; return; }
      if (files.length){
        const ids = [];
        for (let i=0;i<files.length;i++){
          btn.textContent = `画像を保存中 ${i+1}/${files.length}`;
          let data; try{ data = await compress(files[i]); }catch(x){ throw {msg:`「${files[i].name}」を読み込めませんでした。JPG・PNGの画像を選んでください。`}; }
          const pid = newId(); await S.db.doc('pages/'+pid).set({uid:S.uid, workId:w.id, data}); ids.push(pid);
        }
        if (old) for (const pid of (old.pages||[])) { try{ await S.db.doc('pages/'+pid).delete(); }catch(x){} }
        body.pages = ids;
      } else body.pages = old.pages || [];
    }
    const eid = old ? old.id : newId();
    await S.db.doc('episodes/'+eid).set(body);
    const count = old ? S.live.eps.length : S.live.eps.length + 1;
    await S.db.doc('works/'+w.id).update({epCount: count, updatedAt: Date.now()});
    toast(old?'保存しました':'公開しました');
    go('work',{wid:w.id, eid});
  }catch(x){ err.textContent = x && x.msg ? x.msg : dbErr(x); btn.disabled=false; btn.textContent = old?'保存する':'公開する'; }
}

  if (d.act==='import'){ return importData(t); }
  if (d.target){ const g=d.target; if(g==='post') return go('newwork'); if(g==='bible'){ S.f.book='__bible'; return go('search'); } if(g==='spot'||g==='guide') return go(g); if(g.startsWith('site:') || g.startsWith('work:')){ const w = S.works.find(x=>x.id===g.slice(5)), u = extUrl(w); if (u){ recordView(w); return openExternal(u); } if (g.startsWith('work:')) return go('work',{wid:g.slice(5)}); } return; }
  if (d.car){ carPause = true; setTimeout(()=>carPause=false, 8000); return carTo(S.car + Number(d.car), true); }
  if (d.dot !== undefined){ carPause = true; setTimeout(()=>carPause=false, 8000); return carTo(Number(d.dot), true); }
  if (d.act==='bnadd'){
    const err=$('#bn-err'); err.textContent=''; const f=$('#bn-file').files[0]; const title=$('#bn-title').value.trim();
    if (!f && !title){ err.textContent='画像かタイトルのどちらかを入れてください。'; return; }
    t.disabled = true;
    try{ const image = f ? await compress(f, 1400) : '';
      const order = S.banners.reduce((m,b)=>Math.max(m,b.order||0),0) + 1;
      await S.db.doc('banners/'+newId()).set({image, eyebrow:$('#bn-eyebrow').value.trim(), title, text:$('#bn-text').value.trim(), target:$('#bn-target').value, order, active:true, createdAt:Date.now()});
      ['bn-file','bn-eyebrow','bn-title','bn-text'].forEach(id=>{ const el=document.getElementById(id); if(el) el.value=''; });
      toast('バナーを追加しました'); }
    catch(x){ err.textContent = x && x.message==='too_big' ? '画像が大きすぎます。小さめの画像を選んでください。' : dbErr(x); }
    t.disabled = false; return;
  }
  if (d.bnmove){ const i=S.banners.findIndex(b=>b.id===d.bnmove), j=i+Number(d.dir); const a=S.banners[i], b=S.banners[j]; if(!a||!b) return;
    try{ await S.db.doc('banners/'+a.id).update({order:b.order}); await S.db.doc('banners/'+b.id).update({order:a.order}); }catch(x){ toast('並べ替えできませんでした'); } return; }
  if (d.bndel){ if (t.dataset.confirm!=='1'){ t.dataset.confirm='1'; t.textContent='もう一度押すと削除'; return; } try{ await S.db.doc('banners/'+d.bndel).delete(); toast('削除しました'); }catch(x){ toast('削除できませんでした'); } return; }
  if (d.go){ e.preventDefault(); return go(d.go, d.wid ? {wid:d.wid, eid:d.eid} : {}); }
  if (d.open){ const w = S.works.find(x=>x.id===d.open), u = extUrl(w);
    if (u && !['mine','admin'].includes(S.route.name)){ recordView(w); return openExternal(u); }
    return go('work',{wid:d.open}); }
  if (d.back !== undefined) return S.route.wid ? go('work',{wid:S.route.wid, eid:S.route.eid}) : go('home');
  if (d.f){ S.f[d.f] = d.v; return render(false); }
  if (d.ep){ S.route.eid = d.ep; render(false); const rd=document.querySelector('.reader,.manga'); if(rd) rd.scrollIntoView({block:'start'}); return; }
  if (d.rd){ S.reader.vertical = d.rd==='v'; return render(false); }
  if (d.sz){ S.reader.size = Number(d.sz); return render(false); }
  if (d.act==='comment') return postComment(d.wid);
  if (d.delc){ if (t.dataset.confirm!=='1'){ t.dataset.confirm='1'; t.textContent='本当に削除する'; return; } try{ await S.db.doc('comments/'+d.delc).delete(); toast('削除しました'); }catch(x){ toast('削除できませんでした'); } return; }
  if (d.report) return report(d.report, d.id);
  if (d.cancelrep !== undefined){ reportOpen=null; return render(false); }
  if (d.hidec) return modSet('comments', d.hidec, !S.mod.comments[d.hidec]);
  if (d.hidew) return modSet('works', d.hidew, !S.mod.works[d.hidew]);
  if (d.resolve) return modSet('reports', d.resolve, true);
  if (d.amonth){ S.route.month = d.amonth; return render(false); }
  if (d.act==='spotsave'){
    const pick = (document.querySelector('input[name="sp-pick"]:checked')||{}).value, err=$('#sp-err'); err.textContent='';
    const yt = $('#sp-yt').value.trim();
    if (!pick){ err.textContent='作品を選んでください。'; return; }
    if (yt && !/^https:\/\/(www\.)?(youtube\.com|youtu\.be)\//.test(yt)){ err.textContent='YouTubeのURLを入力してください。'; return; }
    if (yt && !$('#sp-consent').checked){ err.textContent='動画のURLを登録する前に、同意の確認にチェックしてください。'; return; }
    const w = S.works.find(x=>x.id===pick);
    try{ await S.db.doc('spotlight/'+d.month).set({workId:pick, title:w?w.title:'', youtube:yt, consent:$('#sp-consent').checked, decidedAt:Date.now()}); toast('保存しました'); }
    catch(x){ err.textContent=dbErr(x); }
    return;
  }
  if (d.delwork){ if (t.dataset.confirm!=='1'){ t.dataset.confirm='1'; t.textContent='もう一度押すと削除します'; return; }
    try{ for (const ep of S.live.eps){ for (const pid of (ep.pages||[])) { try{ await S.db.doc('pages/'+pid).delete(); }catch(x){} } await S.db.doc('episodes/'+ep.id).delete(); }
      await S.db.doc('works/'+d.delwork).delete(); toast('作品を削除しました'); go('mine'); }catch(x){ toast('削除できませんでした'); } return; }
  if (d.delep){ if (t.dataset.confirm!=='1'){ t.dataset.confirm='1'; t.textContent='もう一度押すと削除します'; return; }
    try{ const ep = S.live.eps.find(x=>x.id===d.delep); for (const pid of ((ep&&ep.pages)||[])) { try{ await S.db.doc('pages/'+pid).delete(); }catch(x){} }
      await S.db.doc('episodes/'+d.delep).delete(); await S.db.doc('works/'+S.route.wid).update({epCount: Math.max(0,S.live.eps.length-1), updatedAt:Date.now()});
      toast('削除しました'); go('work',{wid:S.route.wid}); }catch(x){ toast('削除できませんでした'); } return; }
});

// ---------- open access: automatic guest sign-in, no approval ----------
function viewNoConfig(){
  return `<main><div class="empty" style="max-width:600px;margin:40px auto"><h2>Supabaseの設定がまだです</h2><p>js/supabase-config.js に、Supabase の Project URL と anon（public）キーを貼り付けてから、もう一度公開してください。</p></div></main>`;
}
function viewStartError(){
  return `<main><div class="empty" style="max-width:600px;margin:40px auto"><h2>サイトをはじめられませんでした</h2><p>${esc(S.startErr||'')}</p><button class="btn" data-act="retry">もう一度ためす</button></div></main>`;
}
function viewSuspended(){
  return `<main><div class="empty" style="max-width:560px;margin:40px auto"><h2>利用が停止されています</h2><p>運営によって、このアカウントの利用が停止されています。心あたりがないときは、コミュニティの運営に声をかけてください。</p>
    <details style="text-align:left"><summary class="muted" style="cursor:pointer">運営の方へ：このユーザーID</summary><p class="muted" style="margin:6px 0 0;word-break:break-all;user-select:all">${esc(S.uid||'')}</p></details></div></main>`;
}
function accountHtml(){
  return `<section class="panel stack" style="gap:10px"><h2>アカウント</h2>
    <p style="margin:0">ログインの手続きなしで、<b>このブラウザ</b>に自動で記録されたアカウントを使っています。ブラウザのデータを消したり、別のスマホやパソコンで開いたりすると、同じペンネームでは続けられません。</p>
    <p class="muted" style="margin:0">別の端末でも続けたいとき、作品の作者を引き継ぎたいときは、下のユーザーIDを運営に伝えてください。</p>
    <details><summary class="muted" style="cursor:pointer">あなたのユーザーID（運営の登録や引き継ぎに使います）</summary><p class="muted" style="margin:6px 0 0;word-break:break-all;user-select:all">${esc(S.uid||'')}</p></details>
  </section>`;
}
const GICON = `<svg width="18" height="18" viewBox="0 0 48 48" aria-hidden="true"><path fill="#FFC107" d="M43.6 20.5H42V20H24v8h11.3C33.7 32.7 29.2 36 24 36c-6.6 0-12-5.4-12-12s5.4-12 12-12c3.1 0 5.8 1.2 7.9 3.1l5.7-5.7C34 6.1 29.3 4 24 4 12.9 4 4 12.9 4 24s8.9 20 20 20 20-8.9 20-20c0-1.2-.1-2.4-.4-3.5z"/><path fill="#FF3D00" d="M6.3 14.7l6.6 4.8C14.7 15.1 19 12 24 12c3.1 0 5.8 1.2 7.9 3.1l5.7-5.7C34 6.1 29.3 4 24 4 16.3 4 9.7 8.3 6.3 14.7z"/><path fill="#4CAF50" d="M24 44c5.2 0 9.9-2 13.4-5.2l-6.2-5.2C29.2 35.1 26.7 36 24 36c-5.2 0-9.6-3.3-11.3-8l-6.5 5C9.5 39.6 16.2 44 24 44z"/><path fill="#1976D2" d="M43.6 20.5H42V20H24v8h11.3c-.8 2.2-2.2 4.2-4.1 5.6l6.2 5.2C37 39.2 44 34 44 24c0-1.2-.1-2.4-.4-3.5z"/></svg>`;
async function linkGoogle(btn){
  btn.disabled = true;
  try{
    const r = await Auth.linkGoogle();
    if (r === 'switched'){ toast('連携済みのアカウントに切り替えました'); setTimeout(()=>location.reload(), 600); return; }
    S.email = (Auth.current() && Auth.current().email) || ''; toast('Googleと連携しました'); render(false);
  }catch(x){ toast(authErrorText(x)); }
  btn.disabled = false;
}
function adminMembersHtml(){
  const members = Object.entries(S.members).filter(([id])=>id!==S.uid).sort((a,b)=>(a[1].penName||'').localeCompare(b[1].penName||'','ja'));
  const ageText = m => m.age==='minor' ? `18歳未満・保護者の同意${m.guardian?'あり':'なし'}` : '18歳以上';
  return `<section class="panel stack" style="gap:6px"><h2>メンバー（${members.length}人）</h2>
    <p class="muted" style="margin:0">ログインや承認なしで、だれでもペンネームを決めるだけで参加できます。困った使い方をする人がいたら、ここから利用を停止できます。</p>
    ${members.length ? members.map(([id,m])=>`<div class="row" style="justify-content:space-between;border-bottom:1px solid var(--line);padding:8px 0"><span>${esc(m.penName||'名前未設定')} <span class="muted">${ageText(m)}${m.approved===false?' · 停止中':''}</span></span>${m.approved===false
      ? `<button class="linkbtn" data-resume="${esc(id)}">停止を解除</button>` : `<button class="linkbtn" data-suspend="${esc(id)}">利用を停止</button>`}</div>`).join('')
      : '<p class="muted" style="margin:0">まだほかのメンバーはいません。</p>'}
  </section>`;
}
async function importData(btn){
  const f = $('#imp-file').files[0], msg = $('#imp-msg');
  if (!f){ msg.textContent = '取り込むファイルを選んでください。'; return; }
  let data; try{ data = JSON.parse(await f.text()); }catch(x){ msg.textContent = 'ファイルを読み込めませんでした。書き出した .json ファイルを選んでください。'; return; }
  const jobs = [];
  for (const [id, d] of Object.entries(data.pages||{})) jobs.push(['pages', id, {...d, uid:S.uid}]);
  for (const [id, d] of Object.entries(data.works||{})) jobs.push(['works', id, {...d, authorId:S.uid}]);
  for (const [id, d] of Object.entries(data.episodes||{})) jobs.push(['episodes', id, {...d, authorId:S.uid}]);
  if (!jobs.length){ msg.textContent = '取り込める作品が見つかりませんでした。'; return; }
  btn.disabled = true; S.busy = true;
  let result;
  try{
    for (let i=0;i<jobs.length;i++){ const [c,id,d] = jobs[i]; msg.textContent = `取り込み中… ${i+1}/${jobs.length}`; await S.db.doc(c+'/'+id).set(d); }
    result = `${Object.keys(data.works||{}).length}作品を取り込みました。`; toast('取り込みました');
  }catch(x){ result = dbErr(x); }
  S.busy = false; render(false);
  const m2 = $('#imp-msg'); if (m2) m2.textContent = result;
}
let meUnsub = null;
function watchMe(){
  if (meUnsub) return;
  meUnsub = S.db.doc('members/'+S.uid).onSnapshot(s => {
    if (!s.exists) return;
    S.me = s.data();
    if (S.authState==='member' && S.me.approved===false && !S.admin){ S.authState = 'suspended'; render(true); }
    else if (S.authState==='suspended' && S.me.approved!==false){ becomeMember(); }
  }, ()=>{});
}
let started = false;
function becomeMember(){
  S.authState = 'member';
  if (!started){ started = true; startGlobal(); }
  setTimeout(()=>{ if(!S.ready){ S.ready = true; render(false); } }, 6000);
  render(true);
}

// ---------- boot ----------
async function startGuest(){
  S.authState = 'loading'; render(true);
  try{ await Auth.anon(); }
  catch(x){ S.startErr = authErrorText(x); S.authState = 'error'; render(true); }
}
function boot(){
  if (!configured){ S.authState = 'config'; return render(true); }
  S.db = DB;
  render(true);
  Auth.onChange(async user => {
    if (!user) return startGuest();
    S.uid = user.uid; S.email = user.email || '';
    try{ S.admin = (await S.db.doc('admins/'+S.uid).get()).exists; }catch(x){ S.admin = false; }
    let me = null;
    try{ const s = await S.db.doc('members/'+S.uid).get(); me = s.exists ? s.data() : null; }catch(x){}
    S.me = me;
    if (me && me.approved===false && !S.admin){ S.authState = 'suspended'; watchMe(); return render(true); }
    // プロフィールがなくても読める。ペンネームは投稿するときに決める
    watchMe(); becomeMember();
  });
}
boot();
})();
